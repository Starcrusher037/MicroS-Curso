# =========================
# SERVIDOR
# =========================
server.port=8082
spring.application.name=curso-service

# =========================
# H2 DATABASE
# =========================
spring.datasource.url=jdbc:h2:mem:cursosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# H2 CONSOLE (opcional pero útil)
# =========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# LOGS (opcional pero útil para microservicios)
# =========================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================
# OPEN FEIGN (base config)
# =========================
feign.client.config.default.loggerLevel=full

jwt.secret=MI_CLAVE_SUPER_SEGURA_DE_32_O_MAS_BYTES_MINIMO_123456789